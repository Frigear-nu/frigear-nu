name: CI

# Pull requests and the merge queue: the PR already checks the merge commit, and deploy-production.yml builds main. The
# `lint` job also builds the affected packages (and the packages they depend on) with nuxt-module-build, so a build-only
# error such as module-builder's failOnWarn fails the PR instead of release.yml's verify. It is a step, not a job of its
# own: every job pays ~1 minute of setup and is billed rounded up. Apps are not built here: deploy-preview.yml builds
# every collaborator PR.
#
# Almost all test time is @nuxt/test-utils e2e files, each building and booting a Nuxt fixture (15-130 s on a 2 vCPU
# runner). scripts/ci-test-shard.mjs spreads the test files of the affected packages over the `test` matrix, weighted
# by scripts/ci-test-timings.json, and runs two packages at a time (more thrashes the 2 cores). Target: every job
# under ~7 minutes with everything affected. A new e2e fixture costs CI time on every PR that affects its package:
# reuse an existing fixture when you can. See AGENTS.md "CI".
#
# Two tiers for tests. A pull request tests only the packages it changes; nearly every package depends on auth, users
# and module-kit, so testing dependents on every push ran almost the whole suite for any core change. The merge queue
# (`merge_group`) then tests the changed packages plus all their dependents once, before the PR reaches main. Label a
# PR `full-ci` to run the merge queue's set on the PR itself (from its next push: a label alone does not start CI, so
# that other labels never cancel a running check). Lint and build use the full affected set in both tiers.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Changed packages plus their dependents: against the PR merge commit's first parent (the base branch tip), or
  # against the queue's base commit (a merge group can hold several PRs, so HEAD^1 is not enough there).
  TURBO_SCM_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'HEAD^1' }}
  TURBO_SCM_HEAD: HEAD
  AFFECTED: ${{ github.event_name != 'workflow_dispatch' && '--affected' || '' }}
  # Tests: only the changed packages on a pull request (unless labelled `full-ci`), changed + dependents in the queue.
  TEST_SCOPE: >-
    ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '--changed'
    || github.event_name != 'workflow_dispatch' && '--affected' || '' }}
  TURBO_TELEMETRY_DISABLED: 1
  NUXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge queue diffs against its base commit, which can be several commits back.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-

      - name: Lint
        run: pnpm exec turbo run lint $AFFECTED --filter='!//' --concurrency=2 --cache-dir=.turbo

      # The filters mirror the root build:packages script. --affected intersects with them, and ^build adds the
      # packages the affected ones depend on. Runs after a lint failure too, so one push reports both.
      - name: Build packages
        if: ${{ !cancelled() }}
        run: pnpm exec turbo run build $AFFECTED --filter='./packages/**' --filter='!./packages/base-layer' --concurrency=2 --cache-dir=.turbo

  test:
    name: Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge queue diffs against its base commit, which can be several commits back.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: node scripts/ci-test-shard.mjs ${{ matrix.shard }} 4 $TEST_SCOPE
