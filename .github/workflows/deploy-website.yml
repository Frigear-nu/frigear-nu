# Reusable deploy workflow for the website app, called from
# .github/workflows/deploy-production.yml and .github/workflows/deploy-preview.yml
# (see https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows).
#
# Reusable workflows referenced locally (via `./...`) must live directly in
# this repository's .github/workflows directory - GitHub does not support
# local reusable workflow files nested in other directories (e.g.
# apps/website/.github/workflows/deploy.yml), and treats such references as
# remote references missing a required `@version`.
#
# Builds @frigear-nu/website and ships it to Cloudflare:
#  - environment: production -> `wrangler deploy` + migrations against the
#    worker's existing D1 database.
#  - environment: preview    -> creates (or reuses) a per-PR D1 database,
#    builds against it, then uploads a named preview Worker version via
#    `wrangler versions upload --preview-alias`.
name: Website / Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment, "production" or "preview"
        type: string
        required: true
      ref:
        description: Git ref/SHA to check out and deploy
        type: string
        required: true
      pr-number:
        description: Pull request number (required when environment is "preview")
        type: string
        required: false
        default: ''
    outputs:
      preview-url:
        description: Preview deployment URL (only set when environment is "preview")
        value: ${{ jobs.deploy.outputs.preview-url }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  NITRO_PRESET: cloudflare_module
jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      preview-url: ${{ steps.preview-url.outputs.url }}
      preview-version-id: ${{ steps.preview-url.outputs.version_id }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      CLOUDFLARE_DOMAIN_ROOT: ${{ vars.CLOUDFLARE_DOMAIN_ROOT }}
      NITRO_PRESET: cloudflare_module
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create preview D1 database
        if: inputs.environment == 'preview'
        id: preview-db
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        run: pnpm cloudflare:d1:preview:create

      - name: Build
        run: pnpm ${{ inputs.environment == 'preview' && 'cloudflare:build:preview' || 'cloudflare:build' }}
        env:
          NUXT_HUB_CLOUDFLARE_DATABASE_ID: ${{ steps.preview-db.outputs.database_id }}
          NITRO_PRESET: cloudflare_module
          PR_NUMBER: ${{ inputs.pr-number }}

      - name: Deploy
        run: pnpm ${{ inputs.environment == 'preview' && 'cloudflare:web:deploy-preview' || 'cloudflare:web:deploy' }}
        env:
          NITRO_PRESET: cloudflare_module
          CLOUDFLARE_PREVIEW_ALIAS: pr-${{ inputs.pr-number }}-preview
          PR_NUMBER: ${{ inputs.pr-number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson

      # `wrangler versions upload` never attaches routes / custom domains, so a
      # made-up hostname would not resolve. Use the preview alias URL that
      # Cloudflare actually reports for the uploaded version.
      - name: Resolve preview URL
        if: inputs.environment == 'preview'
        id: preview-url
        run: |
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' "$RUNNER_TEMP/wrangler-output.ndjson" | tail -n1)
          if [ -z "$url" ]; then
            echo "::error::wrangler did not report a preview URL (is workers.dev / preview URLs enabled for the worker?)"
            cat "$RUNNER_TEMP/wrangler-output.ndjson"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          version_id=$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$RUNNER_TEMP/wrangler-output.ndjson" | tail -n1)
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: inputs.environment == 'preview'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          PREVIEW_VERSION_ID: ${{ steps.preview-url.outputs.version_id }}
        with:
          script: |
            const marker = '<!-- deploy-preview:result -->'
            const prNumber = Number(process.env.PR_NUMBER)
            const versionsPattern = /<!-- deploy-preview:versions=([\w,-]*) -->/

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            })
            const existing = comments.find((comment) => comment.body.includes(marker))

            // Every push uploads a new Worker version; remember them all so the
            // teardown job can delete them when the PR is closed.
            const versions = new Set(((existing?.body.match(versionsPattern) || [])[1] || '').split(',').filter(Boolean))
            if (process.env.PREVIEW_VERSION_ID) versions.add(process.env.PREVIEW_VERSION_ID)

            const body = [
              marker,
              `<!-- deploy-preview:versions=${[...versions].join(',')} -->`,
              `🚀 Preview deployed: ${process.env.PREVIEW_URL}`,
            ].join('\n')

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body })
            }
