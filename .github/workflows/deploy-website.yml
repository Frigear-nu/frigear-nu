# Reusable deploy workflow for the website app, called from
# .github/workflows/deploy-production.yml and .github/workflows/deploy-preview.yml
# (see https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows).
#
# Reusable workflows referenced locally (via `./...`) must live directly in
# this repository's .github/workflows directory - GitHub does not support
# local reusable workflow files nested in other directories (e.g.
# apps/website/.github/workflows/deploy.yml), and treats such references as
# remote references missing a required `@version`.
#
# Builds @frigear-nu/website and ships it to Cloudflare:
#  - environment: production -> `wrangler deploy` + migrations against the
#    worker's existing D1 database.
#  - environment: preview    -> creates (or reuses) a per-PR D1 database,
#    builds against it, then creates/updates a Worker Preview (`pr-<n>`) under
#    the production Worker via `wrangler preview` (shows up in the dashboard's
#    Preview dropdown). https://developers.cloudflare.com/workers/previews/
name: Website / Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment, "production" or "preview"
        type: string
        required: true
      ref:
        description: Git ref/SHA to check out and deploy
        type: string
        required: true
      pr-number:
        description: Pull request number (required when environment is "preview")
        type: string
        required: false
        default: ''
    outputs:
      preview-url:
        description: Preview deployment URL (only set when environment is "preview")
        value: ${{ jobs.deploy.outputs.preview-url }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  NITRO_PRESET: cloudflare_module
jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      preview-url: ${{ steps.preview-url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      CLOUDFLARE_DOMAIN_ROOT: ${{ vars.CLOUDFLARE_DOMAIN_ROOT }}
      NITRO_PRESET: cloudflare_module
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ inputs.environment }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ inputs.environment }}-
            turbo-build-${{ runner.os }}-

      - name: Create preview D1 database
        if: inputs.environment == 'preview'
        id: preview-db
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        run: pnpm cloudflare:d1:preview:create

      - name: Build
        run: pnpm ${{ inputs.environment == 'preview' && 'cloudflare:build:preview' || 'cloudflare:build' }}
        env:
          TURBO_TELEMETRY_DISABLED: 1
          TURBO_CACHE_DIR: .turbo
          NUXT_HUB_CLOUDFLARE_DATABASE_ID: ${{ steps.preview-db.outputs.database_id }}
          NUXT_HUB_CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          NUXT_HUB_CLOUDFLARE_BUCKET_NAME: ${{ vars.CLOUDFLARE_BUCKET_NAME }}
          NITRO_PRESET: cloudflare_module
          PR_NUMBER: ${{ inputs.pr-number }}

      - name: Deploy
        run: pnpm ${{ inputs.environment == 'preview' && 'cloudflare:web:deploy-preview' || 'cloudflare:web:deploy' }}
        env:
          NITRO_PRESET: cloudflare_module
          CLOUDFLARE_PREVIEW_NAME: pr-${{ inputs.pr-number }}
          PREVIEW_OUTPUT_FILE: ${{ runner.temp }}/preview-output.json
          PR_NUMBER: ${{ inputs.pr-number }}

      # The Preview URL is reported by `wrangler preview --json`. With a custom
      # domain (DEPLOYMENT_HOST, `previews_enabled`) it is pr-<n>.<host>,
      # otherwise <name>-<worker>.<subdomain>.workers.dev.
      - name: Resolve preview URL
        if: inputs.environment == 'preview'
        id: preview-url
        run: |
          cat "$RUNNER_TEMP/preview-output.json"
          # wrangler prints progress (asset upload etc.) to stdout next to the JSON, so the file is not pure JSON:
          # keep everything from the line that opens the top-level object.
          sed -n '/^{/,$p' "$RUNNER_TEMP/preview-output.json" > "$RUNNER_TEMP/preview-result.json"
          url=$(jq -er '.preview.urls[0]' "$RUNNER_TEMP/preview-result.json" || true)
          if [ -z "$url" ]; then
            echo "::error::wrangler did not report a preview URL (enable workers.dev or previews_enabled on the custom domain)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: inputs.environment == 'preview'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        with:
          script: |
            const marker = '<!-- deploy-preview:result -->'
            const prNumber = Number(process.env.PR_NUMBER)

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            })
            const existing = comments.find((comment) => comment.body.includes(marker))

            const body = [
              marker,
              `🚀 Preview deployed: ${process.env.PREVIEW_URL}`,
            ].join('\n')

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body })
            }
