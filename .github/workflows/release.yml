# Publishes one of the public `packages/**` packages to npm using release-it.
#
# Triggered manually so a maintainer picks exactly which package to release and
# what kind of version bump to apply - see apps/docs/content/1.getting-started/4.publishing.md for the full
# walkthrough (including npm Trusted Publishing / OIDC setup, and how to add a
# new package to the `package` choices below).
#
# Choosing `all` releases every package with the same increment. Each package is built and tested on its
# own runner in parallel (`verify`). Then, in one job (`release`), the packages that passed are versioned
# one after another (each release pushes a commit and tag to the branch), built once, and published to npm
# in parallel. A failure in one package does not stop the others, but fails the run. Keep the
# `all` list in the `prepare` job in sync with the `package` choices.
name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (folder under packages/)
        type: choice
        required: true
        options:
          - all
          - account
          - authorization
          - cookie-consent
          - events
          - forms
          - menu
          - module-kit
          - notify
          - oauth-server
          - payments
          - stripe
          - subscriptions
          - ui
          - users
      increment:
        description: Version increment (passed to release-it)
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
          - premajor
          - preminor
          - prepatch
          - prerelease

permissions:
  contents: read

# Releases push to the branch, so never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - id: packages
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = "all" ]; then
            packages='["module-kit","stripe","subscriptions","payments","events","forms","cookie-consent","menu","notify","ui","users","oauth-server","account","authorization"]'
          else
            packages="[\"$PACKAGE\"]"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  # Builds and tests every package in parallel. Nothing is pushed or published here.
  verify:
    needs: prepare
    name: verify (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Builds every workspace package the selected package depends on (recursively), so that e.g.
      # `users` sees `module-kit`'s dist output.
      - name: Build package dependencies
        run: pnpm --filter "{packages/${{ matrix.package }}}^..." run --if-present build

      - name: Test package
        run: pnpm --filter "./packages/${{ matrix.package }}" run --if-present test

      - name: Mark as verified
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir verified
          echo "$PACKAGE" > "verified/$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.package }}
          path: verified/${{ matrix.package }}

  # Versions the verified packages one at a time, then builds and publishes them together. Runs even if
  # some packages failed to verify, so one broken package does not block the rest.
  release:
    needs: [prepare, verify]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the version bump commit/tag and create the GitHub release.
      contents: write
      # Needed to mint the OIDC token npm uses for Trusted Publishing (no npm token required).
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Releases push to this branch; start from its latest commit.
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: verified-*
          path: verified
          merge-multiple: true

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Release
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          INCREMENT: ${{ inputs.increment }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASED_FILE: ${{ runner.temp }}/released
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          failed=()
          for package in $(jq -r '.[]' <<< "$PACKAGES"); do
            if [ ! -f "verified/$package" ]; then
              echo "::error::Skipping $package: build/test did not pass"
              failed+=("$package")
              continue
            fi
            echo "::group::Version $package"
            if bash scripts/release-package.sh "$package" "$INCREMENT"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::Release of $package failed"
              failed+=("$package")
              # Leave the tree as the next package expects it.
              git reset --hard --quiet
              git checkout --quiet "$RELEASE_BRANCH"
            fi
          done

          # Publish what was versioned, even if some packages failed.
          bash scripts/publish-released.sh "$RELEASED_FILE" || failed+=("(npm publish)")

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Not released: ${failed[*]}"
            exit 1
          fi
