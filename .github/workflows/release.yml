# Publishes one of the public `packages/**` packages to npm using release-it.
#
# Triggered manually so a maintainer picks exactly which package to release and
# what kind of version bump to apply - see apps/docs/content/1.getting-started/4.publishing.md for the full
# walkthrough (including npm Trusted Publishing / OIDC setup, and how to add a
# new package to the `package` choices below).
#
# Choosing `all` releases every package with the same increment. Everything is installed and built once,
# the selected packages are tested in parallel, the ones that passed are versioned one after another
# (each release pushes a commit and tag to the branch), and finally all of them are built and published
# to npm in parallel. A failure in one package does not stop the others, but fails the run. Keep the
# `all` list in the `prepare` job in sync with the `package` choices.
name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (folder under packages/)
        type: choice
        required: true
        options:
          - all
          - account
          - cookie-consent
          - events
          - forms
          - menu
          - module-kit
          - notify
          - oauth-server
          - payments
          - stripe
          - subscriptions
          - users
      increment:
        description: Version increment (passed to release-it)
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
          - premajor
          - preminor
          - prepatch
          - prerelease

permissions:
  contents: read

# Releases push to the branch, so never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - id: packages
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = "all" ]; then
            packages='["module-kit","stripe","subscriptions","payments","events","forms","cookie-consent","menu","notify","users","oauth-server","account"]'
          else
            packages="[\"$PACKAGE\"]"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the version bump commit/tag and create the GitHub release.
      contents: write
      # Needed to mint the OIDC token npm uses for Trusted Publishing (no npm token required).
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Releases push to this branch; start from its latest commit.
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      # Nothing is pushed or published until the tests have run. Passing packages get a marker file in
      # `verified/`; a failure here only means that package is skipped below.
      - name: Test packages
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          mkdir verified
          jq -r '.[]' <<< "$PACKAGES" | xargs -P 3 -I{} sh -c \
            'pnpm --filter "./packages/$1" run --if-present test && touch "verified/$1"' _ {} || true

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Release
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          INCREMENT: ${{ inputs.increment }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASED_FILE: ${{ runner.temp }}/released
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          failed=()
          for package in $(jq -r '.[]' <<< "$PACKAGES"); do
            if [ ! -f "verified/$package" ]; then
              echo "::error::Skipping $package: tests did not pass"
              failed+=("$package")
              continue
            fi
            echo "::group::Version $package"
            if bash scripts/release-package.sh "$package" "$INCREMENT"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::Release of $package failed"
              failed+=("$package")
              # Leave the tree as the next package expects it.
              git reset --hard --quiet
              git checkout --quiet "$RELEASE_BRANCH"
            fi
          done

          # Publish what was versioned, even if some packages failed.
          bash scripts/publish-released.sh "$RELEASED_FILE" || failed+=("(npm publish)")

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Not released: ${failed[*]}"
            exit 1
          fi
