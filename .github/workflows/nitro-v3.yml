name: Nitro v3

# Runs module tests on Nitro v3 (h3 v2), which Nuxt 4.7+ builds with when the project lists `nitro` instead of
# `nitropack`. Modules still use the h3 v1 API through Nuxt's `nitroLegacy` layer (on by default on Nuxt 4), so this
# checks that layer covers them. Not on every pull request, to keep CI minutes down: run it by hand on a branch that
# touches server code or Nitro config (`gh workflow run nitro-v3.yml --ref <branch>`). Needs Nuxt 4.7 or later.
#
# Adding `nitro` to the workspace root switches every fixture: a project that lists neither `nitro` nor `nitropack`
# follows the root. Nothing is committed, so the lockfile change stays in the job.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to test (space separated `--filter` values)
        required: false
        default: '@frigear-nu/module-kit @frigear-nu/auth @frigear-nu/oauth-server @frigear-nu/events'

permissions:
  contents: read

concurrency:
  group: nitro-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  NITRO_VERSION: 3.0.261103-rc
  PACKAGES: ${{ inputs.packages || '@frigear-nu/module-kit @frigear-nu/auth @frigear-nu/oauth-server @frigear-nu/events' }}
  TURBO_TELEMETRY_DISABLED: 1
  NUXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Test on Nitro v3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Switch the workspace to Nitro v3
        run: pnpm add --workspace-root --save-dev "nitro@$NITRO_VERSION"

      - name: Test
        run: |
          status=0
          for pkg in $PACKAGES; do
            echo "::group::$pkg"
            pnpm --filter "$pkg" test || status=1
            echo "::endgroup::"
          done
          exit $status
