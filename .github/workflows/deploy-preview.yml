# Deploys preview environments for pull requests on Cloudflare.
#
# Flow (see issue: deploy main and PRs opened by collaborators):
#  - PR opened/updated by a collaborator (OWNER/MEMBER/COLLABORATOR) -> deploy
#    straight to a Cloudflare Worker preview version.
#  - PR opened/updated by anyone else -> comment asking a collaborator to
#    trigger the deployment by commenting `/deploy-preview`.
#  - PR closed (merged or not) -> tear down the per-PR D1 preview database
#    (and, best-effort, the comment trail).
#
# `pull_request_target` (not `pull_request`) is used so that the
# "resolve"/"request-approval"/"teardown" jobs get write permissions and
# secrets even when the PR comes from a fork - a plain `pull_request` trigger
# is always downgraded to a read-only token for fork PRs, which otherwise
# silently breaks posting the approval-request comment for non-collaborator
# contributors. This is safe here because none of those jobs check out the
# PR's own code; only the "deploy" job does that, and only after an explicit
# authorization check (collaborator-authored PR, or an authorized
# `/deploy-preview` comment).
name: Deploy Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  resolve:
    name: Resolve PR context
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve PR details
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName

            let prNumber
            let sha
            let authorAssociation
            let closed = false
            let isDeployCommand = false

            if (eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.setOutput('action', 'ignore')
                return
              }

              const body = (context.payload.comment.body || '').trim().toLowerCase()
              if (body !== '/deploy-preview') {
                core.setOutput('action', 'ignore')
                return
              }

              isDeployCommand = true
              authorAssociation = context.payload.comment.author_association
              prNumber = context.payload.issue.number

              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber })
              sha = pr.head.sha
            } else {
              prNumber = context.payload.pull_request.number
              sha = context.payload.pull_request.head.sha
              authorAssociation = context.payload.pull_request.author_association
              closed = context.payload.pull_request.state === 'closed'
            }

            const authorized = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(authorAssociation)

            let action
            if (eventName === 'pull_request_target' && closed) {
              action = 'teardown'
            } else if (authorized) {
              action = 'deploy'
            } else if (eventName === 'pull_request_target') {
              action = 'request-approval'
            } else {
              // Deploy command from a non-collaborator: let them know it was ignored.
              await github.rest.reactions.createForIssueComment({
                ...context.repo,
                comment_id: context.payload.comment.id,
                content: '-1',
              })
              action = 'ignore'
            }

            core.setOutput('action', action)
            core.setOutput('pr-number', String(prNumber))
            core.setOutput('sha', sha)

  request-approval:
    name: Request collaborator approval
    needs: resolve
    if: needs.resolve.outputs.action == 'request-approval'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- deploy-preview:request-approval -->'
            const prNumber = Number('${{ needs.resolve.outputs.pr-number }}')

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            })

            if (comments.some((comment) => comment.body.includes(marker))) return

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: [
                marker,
                'Thanks for the contribution! This PR was opened by a non-collaborator, so the Cloudflare preview deployment needs to be triggered manually.',
                '',
                'A maintainer can comment `/deploy-preview` on this PR to deploy it.',
              ].join('\n'),
            })

  deploy:
    name: Deploy preview
    needs: resolve
    if: needs.resolve.outputs.action == 'deploy'
    uses: ./.github/workflows/deploy-website.yml
    with:
      environment: preview
      ref: ${{ needs.resolve.outputs.sha }}
      pr-number: ${{ needs.resolve.outputs.pr-number }}
    secrets: inherit

  comment-deployed:
    name: Comment preview URL
    needs: [resolve, deploy]
    if: needs.resolve.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- deploy-preview:result -->'
            const prNumber = Number('${{ needs.resolve.outputs.pr-number }}')
            const previewUrl = '${{ needs.deploy.outputs.preview-url }}'
            const body = [
              marker,
              `🚀 Preview deployed: ${previewUrl}`,
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            })
            const existing = comments.find((comment) => comment.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body })
            }

  teardown:
    name: Tear down preview
    needs: resolve
    if: needs.resolve.outputs.action == 'teardown'
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview D1 database
        run: pnpm cloudflare:d1:preview:delete

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number('${{ needs.resolve.outputs.pr-number }}'),
              body: '🧹 Preview deployment and database were torn down.',
            })
