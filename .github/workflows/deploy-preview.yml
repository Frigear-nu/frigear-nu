# Deploys preview environments for pull requests on Cloudflare.
#
# Flow (see issue: deploy main and PRs opened by collaborators):
#  - PR opened/updated by a collaborator (OWNER/MEMBER/COLLABORATOR) -> deploy
#    straight to a Cloudflare Worker preview version.
#  - PR opened by anyone else -> no preview is deployed.
#  - A collaborator PR is only deployed when it can change the website: a file
#    under apps/website/**, under packages/** (except **/*.md and **/test/**),
#    or pnpm-lock.yaml, pnpm-workspace.yaml or the root package.json. PRs that
#    touch only docs, starters, workflows or scripts are ignored, so they skip
#    the full website build. The files are listed through the API, never by
#    checking out the PR. Adding the `preview` label forces a deploy (and keeps
#    forcing it on later pushes while the label is on the PR).
#  - PR closed (merged or not) -> delete the Worker Preview and the per-PR D1
#    preview database, then update the preview comment to say the deployment was deleted (the link is
#    inactive).
#
# `pull_request_target` (not `pull_request`) is used so that the
# "resolve"/"teardown" jobs get write permissions and secrets even when the PR
# comes from a fork. This is safe here because neither of those jobs checks out
# the PR's own code; only the "deploy" job does that, and only for
# collaborator-authored PRs.
name: Deploy Preview

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, labeled, closed ]

# Adding any other label gets a group of its own, so it cannot cancel a deploy
# in progress (that run resolves to `ignore`).
concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NITRO_PRESET: cloudflare_module

jobs:
  resolve:
    name: Resolve PR context
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      CLOUDFLARE_DOMAIN_ROOT: ${{ vars.CLOUDFLARE_DOMAIN_ROOT }}
      NITRO_PRESET: cloudflare_module
    if: github.repository_owner == 'Frigear-nu'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      sha: ${{ steps.resolve.outputs.sha }}
      # JSON array of { pr, sha } to deploy; used by the deploy matrix.
      deployments: ${{ steps.resolve.outputs.deployments }}
    steps:
      - name: Resolve PR details
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request
            const authorAssociation = pr.author_association
            const closed = pr.state === 'closed'
            console.log({ authorAssociation, prNumber: pr.number, sha: pr.head.sha, closed })

            const authorized = ['OWNER', 'MEMBER', 'COLLABORATOR', 'ADMIN'].includes(authorAssociation)
            const forced = pr.labels.some((label) => label.name === 'preview')

            // Files that can change the website build (see the header comment).
            const ROOT_FILES = ['pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json']
            const affectsWebsite = (file) =>
              ROOT_FILES.includes(file)
              || file.startsWith('apps/website/')
              || (file.startsWith('packages/') && !file.endsWith('.md') && !file.includes('/test/'))

            let action
            // Labelling a PR that is already closed must not tear it down again.
            if (closed) action = context.payload.action === 'closed' ? 'teardown' : 'ignore'
            else if (!authorized) action = 'ignore'
            // Another label was added: nothing to deploy that the last push did not.
            else if (context.payload.action === 'labeled' && context.payload.label.name !== 'preview') action = 'ignore'
            else if (forced) action = 'deploy'
            else {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pr.number,
                per_page: 100,
              })
              // A rename counts for both its old and its new path.
              const relevant = files
                .flatMap((file) => [file.filename, file.previous_filename])
                .filter((file) => file && affectsWebsite(file))
              console.log({ changedFiles: files.length, relevant: relevant.slice(0, 20) })
              action = relevant.length ? 'deploy' : 'ignore'
            }
            console.log('Action:', action)

            core.setOutput('action', action)
            core.setOutput('pr-number', String(pr.number))
            core.setOutput('sha', pr.head.sha)
            core.setOutput(
              'deployments',
              JSON.stringify(action === 'deploy' ? [{ pr: String(pr.number), sha: pr.head.sha }] : []),
            )

  deploy:
    name: Deploy preview
    needs: resolve
    if: needs.resolve.outputs.action == 'deploy'
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.resolve.outputs.deployments) }}
    uses: ./.github/workflows/deploy-website.yml
    with:
      environment: preview
      ref: ${{ matrix.deployment.sha }}
      pr-number: ${{ matrix.deployment.pr }}
    secrets: inherit


  teardown:
    name: Tear down preview
    needs: resolve
    if: needs.resolve.outputs.action == 'teardown'
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview D1 database
        run: pnpm cloudflare:d1:preview:delete

      # Best-effort: a missing Preview or an API hiccup must not stop the
      # comment below from being updated.
      - name: Delete Worker Preview
        run: |
          : "${CLOUDFLARE_WORKER_NAME:?CLOUDFLARE_WORKER_NAME var is required}"
          pnpm --filter @frigear-nu/website exec wrangler preview delete \
            --name "pr-$PR_NUMBER" --worker-name "$CLOUDFLARE_WORKER_NAME" --skip-confirmation \
            || echo "::warning::Could not delete Worker Preview pr-$PR_NUMBER"

      - name: Mark preview as deleted on PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- deploy-preview:result -->'
            const prNumber = Number(process.env.PR_NUMBER)

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            })
            const existing = comments.find((comment) => comment.body.includes(marker))
            // Nothing was ever deployed for this PR, so there is no link to invalidate.
            if (!existing) return

            const body = [marker, '🗑️ Preview deployment deleted. The preview link is no longer active.'].join('\n')
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
