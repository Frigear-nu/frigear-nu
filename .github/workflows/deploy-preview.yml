# Deploys preview environments for pull requests on Cloudflare.
#
# Flow (see issue: deploy main and PRs opened by collaborators):
#  - PR opened/updated by a collaborator (OWNER/MEMBER/COLLABORATOR) -> deploy
#    straight to a Cloudflare Worker preview version.
#  - PR opened by anyone else -> comment asking a collaborator to trigger the
#    deployment by reacting with a rocket (:rocket:) to that comment.
#  - A collaborator (write access or higher) reacting with :rocket: on that
#    comment -> deploy. Removing the reaction and reacting again deploys again.
#  - PR closed (merged or not) -> tear down the per-PR D1 preview database and
#    update the preview comment to say the deployment was deleted (the link is
#    inactive).
#
# GitHub does not emit any webhook event for reactions, so reactions cannot
# trigger a workflow directly. The `schedule` trigger therefore polls the
# approval comment of every open PR. Each rocket reaction has a unique id, so
# the ids that were already deployed are recorded in a hidden marker inside
# the approval comment; a new reaction (e.g. after unmarking and re-reacting)
# has a new id and triggers a new deployment. Scheduled runs are best-effort
# and can be delayed by several minutes.
#
# `pull_request_target` (not `pull_request`) is used so that the
# "resolve"/"request-approval"/"teardown" jobs get write permissions and
# secrets even when the PR comes from a fork - a plain `pull_request` trigger
# is always downgraded to a read-only token for fork PRs, which otherwise
# silently breaks posting the approval-request comment for non-collaborator
# contributors. This is safe here because none of those jobs check out the
# PR's own code; only the "deploy" job does that, and only after an explicit
# authorization check (collaborator-authored PR, or a rocket reaction from a
# collaborator).
name: Deploy Preview

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, closed ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number || 'reactions' }}
  # Never cancel a polling run mid-deploy because the next tick started.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  pull-requests: write

env:
  NITRO_PRESET: cloudflare_module

jobs:
  resolve:
    name: Resolve PR context
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      CLOUDFLARE_DOMAIN_ROOT: ${{ vars.CLOUDFLARE_DOMAIN_ROOT }}
      NITRO_PRESET: cloudflare_module
      CLOUDFLARE_ENV: ${{ inputs.environment }}
    if: github.repository_owner == 'Frigear-nu'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      sha: ${{ steps.resolve.outputs.sha }}
      # JSON array of { pr, sha } to deploy; used by the deploy matrix.
      deployments: ${{ steps.resolve.outputs.deployments }}
    steps:
      - name: Resolve PR details
        id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const approvalMarker = '<!-- deploy-preview:request-approval -->'
            const handledPattern = /<!-- deploy-preview:handled=([\d,]*) -->/
            const isAuthorizedPermission = (permission) => ['admin', 'write'].includes(permission)

            const eventName = context.eventName

            if (eventName !== 'pull_request_target') {
              // Poll the approval comment of every open PR for new rocket reactions.
              const permissionCache = new Map()
              const isCollaborator = async (username) => {
                if (!permissionCache.has(username)) {
                  const { data } = await github.rest.repos
                    .getCollaboratorPermissionLevel({ ...context.repo, username })
                    .catch(() => ({ data: { permission: 'none' } }))
                  permissionCache.set(username, isAuthorizedPermission(data.permission))
                }
                return permissionCache.get(username)
              }

              const deployments = []
              const pulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open' })

              for (const pr of pulls) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  ...context.repo,
                  issue_number: pr.number,
                })
                const approval = comments.find((comment) => comment.body.includes(approvalMarker))
                if (!approval) continue

                const handled = new Set(((approval.body.match(handledPattern) || [])[1] || '').split(',').filter(Boolean))
                const reactions = await github.paginate(github.rest.reactions.listForIssueComment, {
                  ...context.repo,
                  comment_id: approval.id,
                  content: 'rocket',
                })

                const fresh = []
                for (const reaction of reactions) {
                  if (handled.has(String(reaction.id))) continue
                  if (await isCollaborator(reaction.user.login)) fresh.push(reaction)
                }
                if (!fresh.length) continue

                console.log(`PR #${pr.number}: new rocket reaction(s) from`, fresh.map((r) => r.user.login))
                fresh.forEach((reaction) => handled.add(String(reaction.id)))

                // Record before deploying so a failed deploy does not retrigger every poll.
                const body = approval.body.replace(handledPattern, `<!-- deploy-preview:handled=${[...handled].join(',')} -->`)
                await github.rest.issues.updateComment({ ...context.repo, comment_id: approval.id, body })

                deployments.push({ pr: String(pr.number), sha: pr.head.sha })
              }

              console.log('Deployments:', deployments)
              core.setOutput('action', deployments.length ? 'deploy' : 'ignore')
              core.setOutput('deployments', JSON.stringify(deployments))
              return
            }

            const pr = context.payload.pull_request
            const authorAssociation = pr.author_association
            const closed = pr.state === 'closed'
            console.log({ authorAssociation, prNumber: pr.number, sha: pr.head.sha, closed })

            const authorized = ['OWNER', 'MEMBER', 'COLLABORATOR', 'ADMIN'].includes(authorAssociation)

            let action
            if (closed) action = 'teardown'
            else if (authorized) action = 'deploy'
            else action = 'request-approval'
            console.log('Action:', action)

            core.setOutput('action', action)
            core.setOutput('pr-number', String(pr.number))
            core.setOutput('sha', pr.head.sha)
            core.setOutput(
              'deployments',
              JSON.stringify(action === 'deploy' ? [{ pr: String(pr.number), sha: pr.head.sha }] : []),
            )

  request-approval:
    name: Request collaborator approval
    needs: resolve
    if: needs.resolve.outputs.action == 'request-approval'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- deploy-preview:request-approval -->'
            const prNumber = Number('${{ needs.resolve.outputs.pr-number }}')
            
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            })

            if (comments.some((comment) => comment.body.includes(marker))) return

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: [
                marker,
                '<!-- deploy-preview:handled= -->',
                'Thanks for the contribution! This PR was opened by a non-collaborator, so the Cloudflare preview deployment needs to be triggered manually.',
                '',
                'A maintainer can deploy it by reacting to **this comment** with :rocket: (🚀).',
                'To deploy again later, remove the 🚀 reaction and add it again. Only reactions from collaborators with write access are honored.',
                '',
                '_Reactions are picked up by a scheduled check, so the deployment may start a few minutes after reacting._',
              ].join('\n'),
            })

  deploy:
    name: Deploy preview
    needs: resolve
    if: needs.resolve.outputs.action == 'deploy'
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.resolve.outputs.deployments) }}
    uses: ./.github/workflows/deploy-website.yml
    with:
      environment: preview
      ref: ${{ matrix.deployment.sha }}
      pr-number: ${{ matrix.deployment.pr }}
    secrets: inherit


  teardown:
    name: Tear down preview
    needs: resolve
    if: needs.resolve.outputs.action == 'teardown'
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview D1 database
        run: pnpm cloudflare:d1:preview:delete

      - name: Mark preview as deleted on PR
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- deploy-preview:result -->'
            const prNumber = Number(process.env.PR_NUMBER)

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            })
            const existing = comments.find((comment) => comment.body.includes(marker))
            // Nothing was ever deployed for this PR, so there is no link to invalidate.
            if (!existing) return

            const body = [marker, '🗑️ Preview deployment deleted. The preview link is no longer active.'].join('\n')
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
