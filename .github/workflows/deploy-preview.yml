# Deploys preview environments for pull requests on Cloudflare.
#
# Flow (see issue: deploy main and PRs opened by collaborators):
#  - PR opened/updated by a collaborator (OWNER/MEMBER/COLLABORATOR) -> deploy
#    straight to a Cloudflare Worker preview version.
#  - PR opened by anyone else -> no preview is deployed.
#  - PR closed (merged or not) -> tear down the per-PR D1 preview database and the
#    uploaded preview Worker versions, then update the preview comment to say the deployment was deleted (the link is
#    inactive).
#
# `pull_request_target` (not `pull_request`) is used so that the
# "resolve"/"teardown" jobs get write permissions and secrets even when the PR
# comes from a fork. This is safe here because neither of those jobs checks out
# the PR's own code; only the "deploy" job does that, and only for
# collaborator-authored PRs.
name: Deploy Preview

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, closed ]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NITRO_PRESET: cloudflare_module

jobs:
  resolve:
    name: Resolve PR context
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      CLOUDFLARE_DOMAIN_ROOT: ${{ vars.CLOUDFLARE_DOMAIN_ROOT }}
      NITRO_PRESET: cloudflare_module
      CLOUDFLARE_ENV: ${{ inputs.environment }}
    if: github.repository_owner == 'Frigear-nu'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      sha: ${{ steps.resolve.outputs.sha }}
      # JSON array of { pr, sha } to deploy; used by the deploy matrix.
      deployments: ${{ steps.resolve.outputs.deployments }}
    steps:
      - name: Resolve PR details
        id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request
            const authorAssociation = pr.author_association
            const closed = pr.state === 'closed'
            console.log({ authorAssociation, prNumber: pr.number, sha: pr.head.sha, closed })

            const authorized = ['OWNER', 'MEMBER', 'COLLABORATOR', 'ADMIN'].includes(authorAssociation)

            let action
            if (closed) action = 'teardown'
            else if (authorized) action = 'deploy'
            else action = 'ignore'
            console.log('Action:', action)

            core.setOutput('action', action)
            core.setOutput('pr-number', String(pr.number))
            core.setOutput('sha', pr.head.sha)
            core.setOutput(
              'deployments',
              JSON.stringify(action === 'deploy' ? [{ pr: String(pr.number), sha: pr.head.sha }] : []),
            )

  deploy:
    name: Deploy preview
    needs: resolve
    if: needs.resolve.outputs.action == 'deploy'
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.resolve.outputs.deployments) }}
    uses: ./.github/workflows/deploy-website.yml
    with:
      environment: preview
      ref: ${{ matrix.deployment.sha }}
      pr-number: ${{ matrix.deployment.pr }}
    secrets: inherit


  teardown:
    name: Tear down preview
    needs: resolve
    if: needs.resolve.outputs.action == 'teardown'
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DB_NAME: ${{ vars.CLOUDFLARE_DB_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview D1 database
        run: pnpm cloudflare:d1:preview:delete

      - name: Find preview Worker versions
        id: versions
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- deploy-preview:result -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
            })
            const existing = comments.find((comment) => comment.body.includes(marker))
            const versions = ((existing?.body.match(/<!-- deploy-preview:versions=([\w,-]*) -->/) || [])[1] || '')
            core.setOutput('ids', versions)

      # Best-effort: a missing version or an API hiccup must not stop the
      # comment below from being updated.
      - name: Delete preview Worker versions
        if: steps.versions.outputs.ids != ''
        env:
          VERSION_IDS: ${{ steps.versions.outputs.ids }}
        run: |
          : "${CLOUDFLARE_WORKER_NAME:?CLOUDFLARE_WORKER_NAME var is required}"
          for id in ${VERSION_IDS//,/ }; do
            status=$(curl -sS -o "$RUNNER_TEMP/version-delete.json" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$CLOUDFLARE_WORKER_NAME/versions/$id" || true)
            if [ "$status" = "200" ] || [ "$status" = "404" ]; then
              echo "Deleted preview version $id (HTTP $status)"
            else
              echo "::warning::Could not delete preview version $id (HTTP $status)"
              cat "$RUNNER_TEMP/version-delete.json" || true
            fi
          done

      - name: Mark preview as deleted on PR
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- deploy-preview:result -->'
            const prNumber = Number(process.env.PR_NUMBER)

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            })
            const existing = comments.find((comment) => comment.body.includes(marker))
            // Nothing was ever deployed for this PR, so there is no link to invalidate.
            if (!existing) return

            const body = [marker, '🗑️ Preview deployment deleted. The preview link is no longer active.'].join('\n')
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
