name: Starters

# Builds each starter in .starters/ against the published @frigear-nu versions, the way `giget` users get it, fails
# when committed migrations no longer match the modules' schemas (regenerate them, see .starters/AGENTS.md), smoke
# tests the OAuth server of the standalone mobile and multi-platform starters and the desktop app's local mode, and fails
# when the files the starters share drift apart. The desktop starter's Tauri shell is compiled on macOS, Linux and
# Windows on main only.
on:
  pull_request:
    paths:
      - '.starters/**'
      - '.github/workflows/starters.yml'
  push:
    branches: [main]
    paths:
      - '.starters/**'
      - '.github/workflows/starters.yml'
  schedule:
    # Weekly, to catch module releases that change a schema.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter:
    name: ${{ matrix.starter }} starter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starter: [workspace, mobile, mobile-standalone, desktop, multi-platform]
        # The committed migrations each starter checks (none for mobile).
        include:
          - starter: workspace
            migrations: apps/web/server/db/migrations
          - starter: mobile-standalone
            migrations: apps/web/server/db/migrations
          - starter: desktop
            migrations: apps/desktop/server/db/migrations
          - starter: multi-platform
            migrations: apps/web/server/db/migrations apps/desktop/server/db/migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy the starter out of this workspace
        run: cp -R ".starters/${{ matrix.starter }}" "$RUNNER_TEMP/starter"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: .starters/${{ matrix.starter }}/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .starters/${{ matrix.starter }}/.nvmrc

      # Release gate. A starter may depend on @frigear-nu versions that are not on npm yet: a module added, or a
      # feature it needs, in the same PR as the starter change. Until they are released, a pull request skips the
      # build (with a warning naming the missing versions) instead of failing; on main, the schedule and manual runs
      # it fails, because main must only reference released versions. The drift job below always runs.
      - name: Published @frigear-nu versions
        id: gate
        working-directory: ${{ runner.temp }}/starter
        run: |
          missing=()
          while read -r spec; do
            [ -z "$spec" ] && continue
            if [ -z "$(npm view "$spec" version 2>/dev/null)" ]; then missing+=("$spec"); fi
          done < <(node -e '
            const fs = require("node:fs"), path = require("node:path")
            const files = ["package.json"]
            for (const group of ["apps", "packages"]) {
              if (!fs.existsSync(group)) continue
              for (const dir of fs.readdirSync(group)) {
                const file = path.join(group, dir, "package.json")
                if (fs.existsSync(file)) files.push(file)
              }
            }
            const specs = new Set()
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
              for (const deps of [pkg.dependencies, pkg.devDependencies]) {
                for (const [name, range] of Object.entries(deps ?? {})) {
                  if (name.startsWith("@frigear-nu/")) specs.add(`${name}@${range}`)
                }
              }
            }
            console.log([...specs].join("\n"))
          ')
          if [ ${#missing[@]} -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"
          message="Not on npm yet: ${missing[*]}. Release them, then rerun this job."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning title=${{ matrix.starter }} starter skipped::$message"
          else
            echo "::error title=${{ matrix.starter }} starter::$message"
            exit 1
          fi

      - name: Install
        if: steps.gate.outputs.published == 'true'
        working-directory: ${{ runner.temp }}/starter
        run: pnpm install --no-frozen-lockfile

      - name: Prepare env
        if: steps.gate.outputs.published == 'true'
        working-directory: ${{ runner.temp }}/starter
        run: pnpm prepare:env

      - name: Lint
        if: steps.gate.outputs.published == 'true'
        working-directory: ${{ runner.temp }}/starter
        run: pnpm lint

      - name: Typecheck
        if: steps.gate.outputs.published == 'true'
        working-directory: ${{ runner.temp }}/starter
        run: pnpm typecheck

      - name: Build
        if: steps.gate.outputs.published == 'true'
        working-directory: ${{ runner.temp }}/starter
        run: pnpm build

      # The steps above check apps/desktop as the remote SPA; this is its other mode, the app with its own server.
      # The local mode smoke test below builds it.
      - name: Typecheck (desktop local mode)
        if: steps.gate.outputs.published == 'true' && (matrix.starter == 'desktop' || matrix.starter == 'multi-platform')
        working-directory: ${{ runner.temp }}/starter
        run: pnpm typecheck:local

      - name: Migrations are up to date
        if: steps.gate.outputs.published == 'true' && matrix.migrations
        working-directory: ${{ runner.temp }}/starter
        run: |
          git init -q && git add -A ${{ matrix.migrations }}
          git -c user.name=ci -c user.email=ci@localhost commit -qm baseline
          pnpm db:generate
          if [ -n "$(git status --porcelain ${{ matrix.migrations }})" ]; then
            git status --porcelain ${{ matrix.migrations }}
            echo "::error::.starters/${{ matrix.starter }} migrations are stale: regenerate them (see .starters/AGENTS.md)"
            exit 1
          fi

      # The built server answers what apps/mobile needs: discovery, the configured `mobile` client (302 to the login
      # page) and bearer CORS for /api/ from the iOS webview's origin. In multi-platform also what apps/desktop needs:
      # the `desktop` client (deep link), the `desktop-local` client (a loopback redirect on any port) and the Tauri origin.
      - name: OAuth smoke test
        if: steps.gate.outputs.published == 'true' && (matrix.starter == 'mobile-standalone' || matrix.starter == 'multi-platform')
        working-directory: ${{ runner.temp }}/starter/apps/web
        run: |
          PORT=3000 node --env-file=.env .output/server/index.mjs > server.log 2>&1 &
          server=$!
          # Print the server's output whenever the step fails, and stop it either way.
          trap 'rc=$?; [ $rc -eq 0 ] || { echo "--- server.log"; cat server.log; }; kill $server 2>/dev/null || true; exit $rc' EXIT
          base=http://localhost:3000
          check() { # <name> <expected status> <curl args...>
            name=$1 expected=$2; shift 2
            status=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            echo "$name: $status"
            [ "$status" = "$expected" ] || { echo "::error::$name answered $status, expected $expected"; exit 1; }
          }
          curl -s -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 "$base/.well-known/openid-configuration" \
            || { echo "::error::the server did not start"; exit 1; }
          check discovery 200 "$base/.well-known/openid-configuration"
          check authorize 302 "$base/oauth/authorize?client_id=mobile&response_type=code&redirect_uri=com.example.mobile:/auth/callback&scope=openid&state=ci-smoke-state-0001&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256"
          check 'api preflight' 204 -X OPTIONS -H 'Origin: capacitor://localhost' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization' "$base/api/me"
          if [ "${{ matrix.starter }}" = multi-platform ]; then
            pkce='response_type=code&scope=openid&state=ci-smoke-state-0001&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256'
            check 'authorize desktop' 302 "$base/oauth/authorize?client_id=desktop&redirect_uri=com.example.desk:/auth/callback&$pkce"
            check 'authorize desktop-local' 302 "$base/oauth/authorize?client_id=desktop-local&redirect_uri=http://127.0.0.1:49152/auth/frigear&$pkce"
            check 'api preflight (tauri)' 204 -X OPTIONS -H 'Origin: tauri://localhost' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization' "$base/api/me"
          fi

      - name: Setup Bun
        if: steps.gate.outputs.published == 'true' && (matrix.starter == 'desktop' || matrix.starter == 'multi-platform')
        uses: oven-sh/setup-bun@v2

      # The sidecar the desktop app ships in local mode (`nuxt build`, compiled with Bun), without Tauri: on a fresh data
      # folder it applies the migrations, prints `READY <port>` and guards its pages and API. The desktop starter then
      # registers and signs in a user with a cookie session; multi-platform starts a browser handoff at apps/web (built
      # above, on :3000), whose authorize URL apps/web accepts for the `desktop-local` client on the sidecar's port.
      - name: Local mode smoke test
        if: steps.gate.outputs.published == 'true' && (matrix.starter == 'desktop' || matrix.starter == 'multi-platform')
        working-directory: ${{ runner.temp }}/starter
        env:
          DESKTOP_MODE: local
        run: |
          web=
          if [ "${{ matrix.starter }}" = multi-platform ]; then
            (cd apps/web && PORT=3000 exec node --env-file=.env .output/server/index.mjs) > web.log 2>&1 &
            web=$!
          fi
          pnpm desktop:sidecar
          binary=$(ls apps/desktop/src-tauri/binaries/*)
          data=$(mktemp -d)
          DATA_DIR="$data" PORT=0 "$binary" > server.log 2>&1 &
          server=$!
          trap 'rc=$?; [ $rc -eq 0 ] || { echo "--- server.log"; cat server.log; [ -z "$web" ] || { echo "--- web.log"; cat web.log; }; }; kill $server $web 2>/dev/null || true; exit $rc' EXIT
          for _ in $(seq 1 30); do grep -q '^READY ' server.log && break; sleep 1; done
          port=$(sed -n 's/^READY \([0-9]*\)$/\1/p' server.log)
          [ -n "$port" ] || { echo "::error::the sidecar did not print READY"; exit 1; }
          base=http://127.0.0.1:$port
          check() { # <name> <expected status> <curl args...>
            name=$1 expected=$2; shift 2
            status=$(curl -s -o /dev/null -w '%{http_code}' -c cookies -b cookies "$@")
            echo "$name: $status"
            [ "$status" = "$expected" ] || { echo "::error::$name answered $status, expected $expected"; exit 1; }
          }
          check 'home, signed out' 302 "$base/"
          check 'login page' 200 "$base/login"
          check 'api, signed out' 401 "$base/api/me"
          if [ "${{ matrix.starter }}" = desktop ]; then
            body='{"name":"CI","email":"ci@example.com","password":"correct-horse-battery-9"}'
            check register 201 -H 'content-type: application/json' -H "Origin: $base" -d "$body" "$base/api/auth/register"
            check login 200 -H 'content-type: application/json' -H "Origin: $base" -d '{"email":"ci@example.com","password":"correct-horse-battery-9"}' "$base/api/auth/login"
            check 'api, signed in' 200 "$base/api/me"
            check 'home, signed in' 200 "$base/"
          else
            curl -s -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://localhost:3000/.well-known/openid-configuration \
              || { echo "::error::apps/web did not start"; exit 1; }
            attempt=$(curl -s -c cookies -b cookies -H 'content-type: application/json' -H "Origin: $base" -d '{}' "$base/api/auth/frigear/handoffs")
            echo "handoff: $attempt"
            url=$(node -e 'const { authorizeUrl } = JSON.parse(process.argv[1]); if (!authorizeUrl?.includes("client_id=desktop-local")) process.exit(1); console.log(authorizeUrl)' "$attempt") \
              || { echo "::error::the handoff did not answer an authorize URL for desktop-local"; exit 1; }
            check 'authorize (handoff)' 302 "$url"
          fi

  drift:
    name: Shared files are identical
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keep in step with .starters/AGENTS.md. Change a shared file in every starter in the same commit.
      - name: Compare the starters
        run: |
          failed=0
          compare() { # <a> <b> [diff options...]
            a=$1 b=$2; shift 2
            if ! diff -r "$@" "$a" "$b"; then
              echo "::error::$a and $b differ: change both in the same commit"
              failed=1
            fi
          }
          for starter in mobile mobile-standalone desktop multi-platform; do
            for shared in .github .nvmrc .gitignore pnpm-workspace.yaml packages; do
              compare ".starters/workspace/$shared" ".starters/$starter/$shared"
            done
          done
          compare .starters/mobile/apps/mobile .starters/mobile-standalone/apps/mobile
          compare .starters/mobile/apps/mobile .starters/multi-platform/apps/mobile
          # apps/web of multi-platform is the standalone one plus the desktop clients.
          compare .starters/mobile-standalone/apps/web .starters/multi-platform/apps/web \
            -x nuxt.config.ts -x package.json -x AGENTS.md -x migrations
          # apps/desktop of multi-platform is the desktop starter's, signing in at apps/web in both modes.
          compare .starters/desktop/apps/desktop .starters/multi-platform/apps/desktop \
            -x nuxt.config.ts -x identity.ts -x .env.example -x AGENTS.md -x migrations
          # apps/web of the standalone starter is the workspace one plus the OAuth server: only these files differ.
          compare .starters/workspace/apps/web .starters/mobile-standalone/apps/web \
            -x nuxt.config.ts -x package.json -x .env.example -x AGENTS.md -x migrations -x api
          exit $failed

  # The desktop starter's Rust shell, in local mode (its src/lib.rs is the remote one plus the sidecar code), compiled
  # and linked without bundling on each OS. multi-platform generates the same shell from the same module, so it is not
  # compiled twice. On main and by hand only, to save minutes; it needs the published packages,
  # so it waits for the starter jobs.
  desktop-native:
    name: desktop starter, Tauri on ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: starter
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      DESKTOP_MODE: local
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy the starter out of this workspace
        run: cp -R .starters/desktop "$RUNNER_TEMP/starter"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: .starters/desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .starters/desktop/.nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install
        working-directory: ${{ runner.temp }}/starter
        run: pnpm install --no-frozen-lockfile && pnpm prepare:env

      - name: Create src-tauri
        working-directory: ${{ runner.temp }}/starter
        run: pnpm desktop:init && pnpm desktop:doctor

      - name: Build (no installers)
        working-directory: ${{ runner.temp }}/starter
        run: pnpm desktop:build -- --debug --no-bundle
