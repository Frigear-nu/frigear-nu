# Dependabot bundles upgrades into a few grouped PRs a week instead of one PR per package.
version: 2
updates:
  # pnpm workspace: reads pnpm-lock.yaml and the catalog in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # h3 2 needs Nuxt 5 / Nitro 3.
      - dependency-name: 'h3'
        update-types: ['version-update:semver-major']
      # TypeScript 7 has no JS compiler API, which @nuxt/module-builder and vue-tsc need.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # The Nuxt toolchain (the catalog) moves together.
      nuxt:
        patterns:
          - 'nuxt'
          - '@nuxt/*'
          - '@nuxtjs/*'
          - '@nuxthub/*'
          - 'nuxt-*'
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
