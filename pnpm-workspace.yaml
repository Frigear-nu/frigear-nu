packages:
  - 'apps/*'
  - 'packages/*'
# Nuxt Content's MDC parser is loaded in the browser in dev; Vite can only pre-bundle its
# CJS deps (`extend`, `debug`, ...) if `@nuxtjs/mdc` is resolvable from the apps.
publicHoistPattern:
  - '@nuxtjs/mdc'
allowBuilds:
  core-js-pure: false
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@nuxt/content@3.16.1'
  - '@sentry/browser-utils@10.75.1'
  - '@sentry/browser@10.75.1'
  - '@sentry/cloudflare@10.75.1'
  - '@sentry/core@10.75.1'
  - '@sentry/feedback@10.75.1'
  - '@sentry/node-core@10.75.1'
  - '@sentry/node@10.75.1'
  - '@sentry/nuxt@10.75.1'
  - '@sentry/opentelemetry@10.75.1'
  - '@sentry/replay-canvas@10.75.1'
  - '@sentry/replay@10.75.1'
  - '@sentry/server-utils@10.75.1'
  - '@sentry/vue@10.75.1'
  - drizzle-kit@0.31.11
  - drizzle-orm@0.45.3
  - '@nuxt/cli@4.0.0'
  - '@nuxt/kit@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  - '@nuxt/vite-server@4.6.1'
  - nuxt@4.6.1
  - cssnano-utils@8.2.0
  - postcss-merge-rules@9.1.2

overrides:
  # cssnano's `postcss-merge-rules@9.1.0` (pulled in transitively via `nuxt`'s `@nuxt/vite-builder`)
  # depends on `cssnano-utils@^8.1.0`, but calls `sameContainer`, which was only added in
  # `cssnano-utils@8.2.0`. Fixed upstream in `postcss-merge-rules@9.1.2`, which bumps its
  # `cssnano-utils` dependency to `^8.2.0`.
  postcss-merge-rules: ^9.1.2

patchedDependencies:
  '@nuxthub/core@0.10.8': patches/@nuxthub__core@0.10.8.patch

catalog:
  nuxt: ^4.6.1