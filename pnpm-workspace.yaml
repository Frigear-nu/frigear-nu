packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@nuxt/content@3.16.1'
  - '@sentry/browser-utils@10.75.1'
  - '@sentry/browser@10.75.1'
  - '@sentry/cloudflare@10.75.1'
  - '@sentry/core@10.75.1'
  - '@sentry/feedback@10.75.1'
  - '@sentry/node-core@10.75.1'
  - '@sentry/node@10.75.1'
  - '@sentry/nuxt@10.75.1'
  - '@sentry/opentelemetry@10.75.1'
  - '@sentry/replay-canvas@10.75.1'
  - '@sentry/replay@10.75.1'
  - '@sentry/server-utils@10.75.1'
  - '@sentry/vue@10.75.1'
  - drizzle-kit@0.31.11
  - drizzle-orm@0.45.3

patchedDependencies:
  '@nuxthub/core@0.10.8': patches/@nuxthub__core@0.10.8.patch

catalog:
  nuxt: ^4.6.0