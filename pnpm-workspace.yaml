packages:
  - 'apps/*'
  - 'packages/*'
# Nuxt Content's MDC parser is loaded in the browser in dev; Vite can only pre-bundle its
# CJS deps (`extend`, `debug`, ...) if `@nuxtjs/mdc` is resolvable from the apps.
publicHoistPattern:
  - '@nuxtjs/mdc'
allowBuilds:
  core-js-pure: false
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@nuxt/content@3.16.1'
  - '@sentry/browser-utils@10.75.1'
  - '@sentry/browser@10.75.1'
  - '@sentry/cloudflare@10.75.1'
  - '@sentry/core@10.75.1'
  - '@sentry/feedback@10.75.1'
  - '@sentry/node-core@10.75.1'
  - '@sentry/node@10.75.1'
  - '@sentry/nuxt@10.75.1'
  - '@sentry/opentelemetry@10.75.1'
  - '@sentry/replay-canvas@10.75.1'
  - '@sentry/replay@10.75.1'
  - '@sentry/server-utils@10.75.1'
  - '@sentry/vue@10.75.1'
  - drizzle-kit@0.31.11
  - drizzle-orm@0.45.3
  - '@nuxt/cli@4.0.0'
  - '@nuxt/kit@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  - '@nuxt/vite-server@4.6.1'
  - nuxt@4.6.1
  - cssnano-utils@8.2.0
  - postcss-merge-rules@9.1.2
  - '@nuxtjs/robots@7.0.2'
  - '@nuxtjs/sitemap@9.0.1'
  - nuxt-og-image@7.0.2
  - nuxt-seo-utils@9.0.1
  - sitemapd@0.2.3

overrides:
  # cssnano's `postcss-merge-rules@9.1.0` (pulled in transitively via `nuxt`'s `@nuxt/vite-builder`)
  # depends on `cssnano-utils@^8.1.0`, but calls `sameContainer`, which was only added in
  # `cssnano-utils@8.2.0`. Fixed upstream in `postcss-merge-rules@9.1.2`, which bumps its
  # `cssnano-utils` dependency to `^8.2.0`.
  postcss-merge-rules: ^9.1.2

patchedDependencies:
  '@nuxthub/core@0.10.8': patches/@nuxthub__core@0.10.8.patch

# One Nuxt toolchain for the whole workspace: every app and package references these as `catalog:`, so pnpm
# resolves a single copy of each (instead of one per package with its own peer set).
catalog:
  nuxt: ^4.6.1
  '@nuxt/kit': ^4.6.4
  '@nuxt/schema': ^4.6.4
  '@nuxt/ui': ^4.12.0
  '@nuxthub/core': ^0.10.8
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/test-utils': ^4.3.4
  '@nuxt/devtools': ^3.4.2
  '@nuxt/eslint-config': ^1.17.0
  '@nuxt/eslint': ^1.17.0
  '@nuxt/content': ^3.16.2
  '@nuxtjs/i18n': ^10.6.0
  vitest: ^5.1.0
  vue-tsc: ^3.3.14
  typescript: ^6.0.3
  eslint: ^10.14.0
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  '@types/node': ^26.6.6
